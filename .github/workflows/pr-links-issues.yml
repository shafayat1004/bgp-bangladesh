name: PR links issues

# Every PR says which issues it closes ("Fixes #12"), which it only moves
# forward ("Part of #12"), or that it has none ("No issue"). GitHub closes
# the "Fixes" issues when the PR merges into main.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the description for issue links
        env:
          # Passed through the environment, never pasted into the script.
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Ignore the template's <!-- instructions -->, which contain examples.
          text=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          closes=$(printf '%s' "$text" | grep -Eio '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' || true)
          if [ -n "$closes" ]; then
            echo "Merging closes:"; echo "$closes"
            exit 0
          fi
          if printf '%s' "$text" | grep -Eiq '\bpart of[[:space:]]+#[0-9]+|\bno issue\b'; then
            echo "No issue to close (Part of / No issue)."
            exit 0
          fi
          echo "::error::Add 'Fixes #N' for each issue this PR finishes (merging closes it), 'Part of #N' for partial work, or 'No issue'."
          exit 1
